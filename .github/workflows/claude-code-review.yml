name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # First review on a PR: spend the more capable (and more expensive)
      # model on the thorough initial pass.
      - name: Run Claude Code Review (Opus, initial)
        id: opus-review
        if: github.event.action == 'opened'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and look for bugs, correctness issues,
            and security problems. Only report on issues you actually find. Be concise.

            Note: The PR branch is already checked out in the current working directory,
            so you can read files directly for context beyond the diff.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to flag specific lines. Use `gh pr comment` only for feedback that isn't tied to
            a specific line. Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --model claude-opus-5
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*)"

      # Correction pushes while the PR is still being iterated on: use the
      # cheaper/faster model. It also assesses whether the change is
      # significant enough to warrant a deeper look (via structured output),
      # which can trigger one last Opus run below.
      - name: Run Claude Code Review (Sonnet, correction push)
        id: sonnet-review
        if: github.event.action == 'synchronize'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and look for bugs, correctness issues,
            and security problems. Only report on issues you actually find. Be concise.

            Note: The PR branch is already checked out in the current working directory,
            so you can read files directly for context beyond the diff.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to flag specific lines. Use `gh pr comment` only for feedback that isn't tied to
            a specific line. Only post GitHub comments - don't submit review text as messages.

            Finally, assess whether this change is significant enough to warrant a
            second review pass by a more capable model - e.g. it touches
            security-sensitive code, core architecture, or is otherwise a large or
            complex diff, as opposed to a small, low-risk, mechanical, or
            well-contained change. Report that as `significant_change` (boolean) in
            your structured output.

          claude_args: |
            --model claude-sonnet-5
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"significant_change":{"type":"boolean","description":"True if this PR is large or risky enough that a second review pass by a more capable model is worthwhile (e.g. touches security-sensitive code, core architecture, or is a large/complex diff). False for small, low-risk, mechanical, or well-contained changes."}},"required":["significant_change"]}'

      # Sonnet flagged this correction push as a significant change - spend
      # one more Opus pass as a deeper final check before the PR is
      # considered done.
      - name: Run Claude Code Review (Opus, final check)
        id: opus-final-review
        if: >-
          github.event.action == 'synchronize' &&
          steps.sonnet-review.outcome == 'success' &&
          fromJSON(steps.sonnet-review.outputs.structured_output).significant_change == true
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Sonnet just reviewed this pull request and flagged it as a significant
            change that warrants a deeper look. Do one more thorough pass as a final
            check before this PR is considered done - look for bugs, correctness
            issues, and security problems. Only report on issues you actually find.
            Be concise.

            Note: The PR branch is already checked out in the current working directory,
            so you can read files directly for context beyond the diff.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to flag specific lines. Use `gh pr comment` only for feedback that isn't tied to
            a specific line. Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --model claude-opus-5
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*)"

      # anthropics/claude-code-action redacts the SDK's error text from the job
      # log by default (only `show_full_output: true` prints it, which also
      # dumps every tool call's raw output - too broad for a PR-triggered,
      # semi-trusted workflow). The unredacted result is still written to
      # `execution_file` on disk even on failure, so pull just the terminal
      # result message's `.result`/`.errors` out of it - enough to see *why*
      # it failed without echoing full tool transcripts. Exactly one of the
      # three review steps above runs per trigger, so at most one of them
      # can be the failing one.
      - name: Surface Claude Code failure reason
        if: |
          steps.opus-review.outcome == 'failure' ||
          steps.sonnet-review.outcome == 'failure' ||
          steps.opus-final-review.outcome == 'failure'
        env:
          OPUS_OUTCOME: ${{ steps.opus-review.outcome }}
          OPUS_FILE: ${{ steps.opus-review.outputs.execution_file }}
          SONNET_OUTCOME: ${{ steps.sonnet-review.outcome }}
          SONNET_FILE: ${{ steps.sonnet-review.outputs.execution_file }}
          OPUS_FINAL_OUTCOME: ${{ steps.opus-final-review.outcome }}
          OPUS_FINAL_FILE: ${{ steps.opus-final-review.outputs.execution_file }}
        run: |
          if [ "$OPUS_OUTCOME" = "failure" ]; then
            STEP_NAME="Opus review (initial)"
            FILE="$OPUS_FILE"
          elif [ "$SONNET_OUTCOME" = "failure" ]; then
            STEP_NAME="Sonnet review (correction push)"
            FILE="$SONNET_FILE"
          else
            STEP_NAME="Opus review (final check)"
            FILE="$OPUS_FINAL_FILE"
          fi

          echo "## :x: Claude Code Review failed ($STEP_NAME)" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            SUBTYPE=$(jq -r '([.[] | select(.type == "result")] | last | .subtype) // "unknown"' "$FILE")
            REASON=$(jq -r '
              ([.[] | select(.type == "result")] | last) as $r
              | if $r == null then
                  "no result message found in execution file"
                else
                  ($r.result // (($r.errors // ["result message had no .result or .errors field"]) | join("; ")))
                end
            ' "$FILE")

            {
              echo "**subtype:** \`$SUBTYPE\`"
              echo '```'
              echo "$REASON"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            ANNOTATION=$(printf '%s' "$REASON" | tr '\n' ' ' | cut -c1-500)
            echo "::error::Claude Code Review ($STEP_NAME) failed ($SUBTYPE): $ANNOTATION"
          else
            MSG="No execution file was produced for $STEP_NAME - Claude Code likely failed before or during startup (auth, installation, or setup). Check the steps above this one in the job log."
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$MSG"
          fi

      - name: Fail job if Claude Code Review failed
        if: |
          steps.opus-review.outcome == 'failure' ||
          steps.sonnet-review.outcome == 'failure' ||
          steps.opus-final-review.outcome == 'failure'
        run: exit 1
