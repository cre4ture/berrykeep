name: Sys

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # sccache (RUSTC_WRAPPER) cannot cache incremental compilation; disabling it
  # lets sccache actually cache rustc invocations across CI runs.
  CARGO_INCREMENTAL: "0"
  # Pull requests can restore caches from main, but their merge-ref caches are
  # not reusable by main or by unrelated pull requests.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}

jobs:
  system-tests:
    name: Sys (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: win
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux FUSE runtime
        if: ${{ matrix.label == 'linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3
          fusermount3_path="$(dpkg-query --listfiles fuse3 | awk '/\/fusermount3$/ { print; exit }')"
          test -n "$fusermount3_path"
          export PATH="$(dirname "$fusermount3_path"):$PATH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          test "$(readlink -f "$(command -v fusermount3)")" = "$(readlink -f "$fusermount3_path")"
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse
          ls -l /dev/fuse "$fusermount3_path"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AWS CLI
        run: python -m pip install --upgrade pip awscli

      - name: Verify AWS CLI
        run: aws --version

      - name: Install web workspace dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run system tests
        run: cargo -Z bindeps test --locked --manifest-path tests/system-tests/Cargo.toml --lib

  quic-network-tests:
    name: Sys (linux QUIC network)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      IRONMESH_QUIC_TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/quic-network
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install network-namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 nftables

      - name: Enable unprivileged user namespaces
        run: |
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v nft
          command -v tc
          unshare --user --map-root-user true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web workspace dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run QUIC network tests
        shell: bash
        run: |
          mkdir -p "${IRONMESH_QUIC_TEST_ARTIFACT_DIR}"
          cargo -Z bindeps test --locked \
            --manifest-path tests/system-tests/Cargo.toml \
            --test quic_network \
            -- --test-threads=1 --nocapture \
            2>&1 | tee "${IRONMESH_QUIC_TEST_ARTIFACT_DIR}/test-output.log"

      - name: Upload QUIC network test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: quic-network-test-diagnostics
          path: ${{ env.IRONMESH_QUIC_TEST_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7

  required-system-tests:
    name: Required system tests
    if: ${{ always() }}
    needs:
      - system-tests
      - quic-network-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify required system-test results
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status '
            all(.[]; .result == "success" or .result == "skipped")
          ' <<<"${REQUIRED_RESULTS}"
