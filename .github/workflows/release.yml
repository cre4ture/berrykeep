name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate annotated release tag and workspace version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v([1-9][0-9]*)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use the stable vX.Y.Z form; received '$RELEASE_TAG'." >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]; then
            echo "Release tags must be annotated." >&2
            exit 1
          fi
          workspace_version="$(python3 - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as cargo_toml:
              print(tomllib.load(cargo_toml)['workspace']['package']['version'])
          PY
          )"
          if [ "v$workspace_version" != "$RELEASE_TAG" ]; then
            echo "Tag '$RELEASE_TAG' does not match workspace version '$workspace_version'." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$workspace_version" >> "$GITHUB_OUTPUT"

  windows-server-node-build:
    name: Windows Server Node release build
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web workspace dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-targets: false

      - name: Build unsigned Windows Server Node MSI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $thumbprint = ($env:BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($thumbprint -notmatch '^[0-9A-F]{40}$') {
            throw "BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT must be a repository variable containing a SHA-1 certificate thumbprint."
          }

          & .\windows\server-node-installer\Build-Msi.ps1 `
            -ProductVersion $env:RELEASE_VERSION `
            -SigningCertificateThumbprint $thumbprint

          $msiCandidates = @(Get-ChildItem -LiteralPath .\windows\server-node-installer\out -Filter *.msi -File -Recurse)
          if ($msiCandidates.Count -ne 1) {
            throw "The unsigned MSI build must produce exactly one MSI; found $($msiCandidates.Count)."
          }
          Write-Host "Built unsigned MSI: $($msiCandidates[0].FullName)"

      - name: Upload unsigned Windows Server Node MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-windows-server-node-msi
          path: windows/server-node-installer/out/**/*.msi
          if-no-files-found: error
          retention-days: 1

  windows-client-build:
    name: Windows client MSIX release build
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web workspace dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-targets: false

      - name: Build unsigned Windows client MSIX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = "$($env:RELEASE_VERSION).0"
          & .\windows\thumbnail-provider\Build-StoreUploadPackage.ps1 `
            -PackageVersion $packageVersion `
            -SkipSigning

          $msixCandidates = @(Get-ChildItem -LiteralPath .\windows\thumbnail-provider\out\store-upload -Filter *.msix -File -Recurse)
          if ($msixCandidates.Count -ne 1) {
            throw "The unsigned Windows client build must produce exactly one MSIX; found $($msixCandidates.Count)."
          }
          Write-Host "Built unsigned MSIX: $($msixCandidates[0].FullName)"

      - name: Upload unsigned Windows client MSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-windows-client-msix
          path: windows/thumbnail-provider/out/store-upload/**/*.msix
          if-no-files-found: error
          retention-days: 1

  windows-server-node-sign:
    name: Windows Server Node release signing
    needs: [validate, windows-server-node-build]
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
    steps:
      - name: Checkout protected signing utilities
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download unsigned Windows Server Node MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-windows-server-node-msi
          path: ${{ runner.temp }}/unsigned-windows-server-node-msi

      - name: Sign and verify Windows Server Node release assets
        shell: powershell
        env:
          BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_B64: ${{ secrets.BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_B64 }}
          BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          BERRYKEEP_WINDOWS_TIMESTAMP_URL: ${{ vars.BERRYKEEP_WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_B64) -or [string]::IsNullOrWhiteSpace($env:BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "The release-signing environment must provide the certificate and certificate password."
          }

          $expectedThumbprint = ($env:BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($expectedThumbprint -notmatch '^[0-9A-F]{40}$') {
            throw "BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT must be a repository variable containing a SHA-1 certificate thumbprint."
          }

          $msiCandidates = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "unsigned-windows-server-node-msi") -Filter *.msi -File -Recurse)
          if ($msiCandidates.Count -ne 1) {
            throw "The unsigned release artifact must contain exactly one MSI; found $($msiCandidates.Count)."
          }
          $msiPath = $msiCandidates[0].FullName

          $certificatePath = Join-Path $env:RUNNER_TEMP "berrykeep-release-signing.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_B64))
          try {
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath, $env:BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
            if (-not $certificate.HasPrivateKey) {
              throw "The configured release certificate has no private key."
            }
            if ((($certificate.Thumbprint -replace '\s', '').ToUpperInvariant()) -ne $expectedThumbprint) {
              throw "The release certificate does not match BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT."
            }

            $signingArguments = @{
              MsiPath = $msiPath
              SigningCertificatePath = $certificatePath
              SigningCertificatePassword = $env:BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_PASSWORD
              SigningCertificateThumbprint = $expectedThumbprint
            }
            if (-not [string]::IsNullOrWhiteSpace($env:BERRYKEEP_WINDOWS_TIMESTAMP_URL)) {
              $signingArguments.TimestampUrl = $env:BERRYKEEP_WINDOWS_TIMESTAMP_URL
            }
            & .\windows\server-node-installer\Sign-Msi.ps1 @signingArguments

            $assetDirectory = Join-Path $env:RUNNER_TEMP "release-assets"
            New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
            $assetName = "berrykeep-server-node-$($env:RELEASE_VERSION)-windows-x64.msi"
            $assetPath = Join-Path $assetDirectory $assetName
            Copy-Item -LiteralPath $msiPath -Destination $assetPath
            $installerUri = "https://github.com/${{ github.repository }}/releases/download/$($env:RELEASE_TAG)/$assetName"
            & .\windows\server-node-installer\New-ReleaseManifest.ps1 `
              -MsiPath $assetPath `
              -Version $env:RELEASE_VERSION `
              -InstallerUri $installerUri `
              -SigningCertificatePath $certificatePath `
              -SigningCertificatePassword $env:BERRYKEEP_WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
              -OutputDirectory $assetDirectory
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Test Windows Server Node updater scripts
        run: powershell -ExecutionPolicy Bypass -File .\windows\server-node-installer\Test-UpdateScripts.ps1

      - name: Upload release assets for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-server-node
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1

  windows-client-sign:
    name: Windows client MSIX release signing
    needs: [validate, windows-client-build]
    runs-on: windows-latest
    environment: windows-client-signing
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_THUMBPRINT }}
    steps:
      - name: Checkout protected signing utilities
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download unsigned Windows client MSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-windows-client-msix
          path: ${{ runner.temp }}/unsigned-windows-client-msix

      - name: Sign and verify Windows client release assets
        shell: powershell
        env:
          BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_B64: ${{ secrets.BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_B64 }}
          BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_B64) -or [string]::IsNullOrWhiteSpace($env:BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "The windows-client-signing environment must provide the certificate and certificate password."
          }

          $expectedThumbprint = ($env:BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($expectedThumbprint -notmatch '^[0-9A-F]{40}$') {
            throw "BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_THUMBPRINT must be a repository variable containing a SHA-1 certificate thumbprint."
          }

          $msixCandidates = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "unsigned-windows-client-msix") -Filter *.msix -File -Recurse)
          if ($msixCandidates.Count -ne 1) {
            throw "The unsigned release artifact must contain exactly one MSIX; found $($msixCandidates.Count)."
          }

          $releaseAssetDirectory = Join-Path $env:RUNNER_TEMP "release-windows-client"
          New-Item -ItemType Directory -Path $releaseAssetDirectory -Force | Out-Null
          $clientPackageVersion = "$($env:RELEASE_VERSION).0"
          $msixPath = Join-Path $releaseAssetDirectory "berrykeep-client-$clientPackageVersion-windows-x64.msix"
          $certificatePath = Join-Path $releaseAssetDirectory "berrykeep-client-$clientPackageVersion-windows-x64.cer"
          $uploadPath = Join-Path $releaseAssetDirectory "berrykeep-client-$clientPackageVersion-windows-x64.msixupload"
          Copy-Item -LiteralPath $msixCandidates[0].FullName -Destination $msixPath

          $signingCertificatePath = Join-Path $env:RUNNER_TEMP "berrykeep-windows-client-signing.pfx"
          [System.IO.File]::WriteAllBytes($signingCertificatePath, [Convert]::FromBase64String($env:BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_B64))
          try {
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($signingCertificatePath, $env:BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_PASSWORD)
            if (-not $certificate.HasPrivateKey) {
              throw "The configured Windows client certificate has no private key."
            }
            if ((($certificate.Thumbprint -replace '\s', '').ToUpperInvariant()) -ne $expectedThumbprint) {
              throw "The Windows client certificate does not match BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_THUMBPRINT."
            }

            & .\windows\thumbnail-provider\Sign-Msix.ps1 `
              -MsixPath $msixPath `
              -SigningCertificatePath $signingCertificatePath `
              -SigningCertificatePassword $env:BERRYKEEP_WINDOWS_CLIENT_SIGNING_CERTIFICATE_PASSWORD `
              -SigningCertificateThumbprint $expectedThumbprint `
              -PublicCertificatePath $certificatePath

            & .\windows\thumbnail-provider\New-MsixUploadPackage.ps1 `
              -MsixPath $msixPath `
              -OutputPath $uploadPath
          }
          finally {
            Remove-Item -LiteralPath $signingCertificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Test Windows client packaging scripts
        run: powershell -ExecutionPolicy Bypass -File .\windows\thumbnail-provider\Test-PackagingScripts.ps1

      - name: Upload signed Windows client release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-client
          path: ${{ runner.temp }}/release-windows-client/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [validate, windows-server-node-sign, windows-client-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-windows-server-node
          path: release-assets

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum berrykeep-server-node-*.msi berrykeep-server-node-stable.json berrykeep-server-node-stable.json.p7s > SHA256SUMS

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "BerryKeep $RELEASE_VERSION" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
