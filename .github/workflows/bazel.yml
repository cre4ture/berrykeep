name: Bazel

on:
  push:
    branches:
      - main
    paths:
      - '.bazelrc'
      - '.bazelversion'
      - 'BUILD.bazel'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'crates/**'
      - '.github/actions/native-unit/**'
      - '.github/workflows/bazel.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.bazelrc'
      - '.bazelversion'
      - 'BUILD.bazel'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'crates/**'
      - '.github/actions/native-unit/**'
      - '.github/workflows/bazel.yml'
  workflow_dispatch:
    inputs:
      write_cache:
        description: Seed the branch-scoped Bazel cache from this trusted run
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Bazel unit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Manifest-head discovery calls GitHub's cache REST API. Keep that scope
    # out of untrusted fork workflows; those use the isolated job below.
    permissions:
      contents: read
      actions: read
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.write_cache && 120 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run trusted Bazel unit suite
        uses: ./.github/actions/native-unit
        with:
          disk-cache: ${{ github.event_name == 'workflow_dispatch' && 'false' || github.workflow }}
          cache-save: ${{ github.event_name != 'pull_request' }}
          write: ${{ github.event_name == 'workflow_dispatch' && inputs.write_cache && 'true' || 'false' }}
          storage-mode: packs

  unit-fork:
    name: Bazel unit (fork)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run isolated fork Bazel unit suite
        uses: ./.github/actions/native-unit
        with:
          # No Actions-cache REST access is granted to a fork. Object mode is
          # a correct, read-only fallback and cannot discover DAG manifests.
          disk-cache: ${{ github.workflow }}
          cache-save: 'false'
          write: 'false'
          storage-mode: objects
