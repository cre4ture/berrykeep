name: Bazel

on:
  push:
    branches:
      - main
    paths:
      - '.bazelrc'
      - '.bazelversion'
      - 'BUILD.bazel'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'crates/**'
      - '.github/workflows/bazel.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.bazelrc'
      - '.bazelversion'
      - 'BUILD.bazel'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'crates/**'
      - '.github/workflows/bazel.yml'
  workflow_dispatch:
    inputs:
      write_cache:
        description: Seed the branch-scoped Bazel cache from this trusted run
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Bazel unit
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.write_cache && 120 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Start GitHub-backed Bazel cache
        id: bazel-cache
        uses: cre4ture/bazel-github-actions-cache-v2@282fea6d5654cf9f04567f9208a3612f97b2ba41 # v0.2.0
        with:
          # Fine-grained publication is intentionally limited to an explicit
          # maintainer seed because one GitHub cache entry per Bazel object can
          # make large default-branch builds wait on thousands of uploads.
          write: ${{ github.event_name == 'workflow_dispatch' && inputs.write_cache && 'true' || 'false' }}
          key-prefix: ironmesh-bazel-v1

      - name: Test native Bazel targets
        shell: bash
        env:
          BAZEL_REMOTE_CACHE_URL: ${{ steps.bazel-cache.outputs.url }}
          BAZEL_REMOTE_CACHE_WRITABLE: ${{ steps.bazel-cache.outputs.writable }}
        run: |
          set -euo pipefail
          bazel test //:unit \
            "--remote_cache=${BAZEL_REMOTE_CACHE_URL}" \
            "--remote_upload_local_results=${BAZEL_REMOTE_CACHE_WRITABLE}"
