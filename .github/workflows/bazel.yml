name: Bazel

on:
  push:
    branches:
      - main
    paths:
      - '.bazelrc'
      - '.bazelversion'
      - 'BUILD.bazel'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'crates/**'
      - '.github/workflows/bazel.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.bazelrc'
      - '.bazelversion'
      - 'BUILD.bazel'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'crates/**'
      - '.github/workflows/bazel.yml'
  workflow_dispatch:
    inputs:
      write_cache:
        description: Seed the branch-scoped Bazel cache from this trusted run
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  unit:
    name: Bazel unit
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.write_cache && 120 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          # Manual runs isolate the fine-grained remote-cache evaluation from
          # restored action outputs while retaining Bazelisk/repository caches.
          disk-cache: ${{ github.event_name == 'workflow_dispatch' && 'false' || github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Start GitHub-backed Bazel cache
        id: bazel-cache
        uses: cre4ture/bazel-github-actions-cache-v2@3a768d2b634f82a23405c838a4aa9c4e971fe65b # v0.3.0
        with:
          # Fine-grained publication is intentionally limited to an explicit
          # maintainer seed. The packed backend turns many Bazel objects into
          # one CARv2 upload plus its manifest commit point.
          write: ${{ github.event_name == 'workflow_dispatch' && inputs.write_cache && 'true' || 'false' }}
          # A format-specific namespace keeps the previous v0.2 objects as a
          # rollback path and never mixes them with CARv2 pack entries.
          key-prefix: ironmesh-bazel-car-v1
          storage-mode: packs
          pack-size-mb: "8"

      - name: Test native Bazel targets
        shell: bash
        env:
          BAZEL_REMOTE_CACHE_URL: ${{ steps.bazel-cache.outputs.url }}
          BAZEL_REMOTE_CACHE_WRITABLE: ${{ steps.bazel-cache.outputs.writable }}
        run: |
          set -euo pipefail
          bazel test //:unit \
            "--remote_cache=${BAZEL_REMOTE_CACHE_URL}" \
            "--remote_upload_local_results=${BAZEL_REMOTE_CACHE_WRITABLE}"
