name: Cov

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # sccache (RUSTC_WRAPPER) cannot cache incremental compilation; disabling it
  # lets sccache actually cache rustc invocations across CI runs.
  CARGO_INCREMENTAL: "0"
  # Pull requests can restore caches from main, but their merge-ref caches are
  # not reusable by main or by unrelated pull requests.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}

jobs:
  coverage:
    name: Cov
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web workspace dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Linux FUSE runtime
        uses: ./.github/actions/setup-linux-fuse

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AWS CLI
        run: python -m pip install --upgrade pip awscli

      - name: Verify AWS CLI
        run: aws --version

      - name: Install Rust toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-17
          components: llvm-tools-preview

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Run unit and system coverage
        run: |
          coverage_ignore_regex='crates/common/src/lib.rs|crates/client-sdk/src/content_addressed_client_cache.rs|crates/server-node-sdk/src/(embedded_rendezvous|setup|ui\.rs)|crates/server-node-sdk/src/web_maps(\.rs|/)'

          cargo +nightly-2026-02-17 llvm-cov clean --workspace
          cargo +nightly-2026-02-17 llvm-cov --locked \
            --workspace \
            --all-features \
            --no-report

          cargo +nightly-2026-02-17 llvm-cov --locked \
            -Z bindeps \
            --manifest-path tests/system-tests/Cargo.toml \
            --lib \
            --dep-coverage client-sdk,sync-core,transport-sdk,rendezvous-server,server-node-sdk \
            --no-report

          mkdir -p target/coverage
          cargo +nightly-2026-02-17 llvm-cov report \
            -p client-sdk \
            -p sync-core \
            -p transport-sdk \
            -p rendezvous-server \
            -p server-node-sdk \
            --lcov \
            --output-path target/coverage/lcov.info \
            --ignore-filename-regex "${coverage_ignore_regex}"

          cargo +nightly-2026-02-17 llvm-cov report \
            -p client-sdk \
            -p sync-core \
            -p transport-sdk \
            -p rendezvous-server \
            -p server-node-sdk \
            --summary-only \
            --ignore-filename-regex "${coverage_ignore_regex}" \
            --fail-under-lines 68

      - name: Upload line coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-line-coverage
          path: target/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  required-coverage:
    name: Required coverage
    if: ${{ always() }}
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Verify required coverage result
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status '
            all(.[]; .result == "success" or .result == "skipped")
          ' <<<"${REQUIRED_RESULTS}"
