name: Server Node Debian packages

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and deploy the verified server-node package matrix.
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-static-server-node:
    name: Static Server Node (${{ matrix.architecture }})
    # Package builds are intentionally opt-in on pull requests. Pushes to main
    # and manual runs always build the complete portable package matrix.
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:debian-packages') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            rust_target: aarch64-unknown-linux-musl
            variant_id: aarch64-generic
            run_smoke: never
            rust_cache_key: static-server-node-aarch64
          - architecture: amd64
            rust_target: x86_64-unknown-linux-musl
            variant_id: x86_64-generic
            run_smoke: always
            rust_cache_key: static-server-node-x86-64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # server-node-sdk's frontend build invokes pnpm from nested package
      # scripts, so Corepack alone is insufficient: pnpm itself must be on
      # PATH for those scripts.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-17

      - name: Install ELF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils file xz-utils

      - name: Install QEMU for the AArch64 smoke test
        if: ${{ matrix.architecture == 'arm64' }}
        run: sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Restore Zig toolchain cache
        id: restore-zig
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ironmesh-build-tools
          key: static-server-node-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Cache static Server Node Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust_cache_key }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build and verify static ${{ matrix.architecture }} Server Node
        run: |
          ./scripts/build-static-server-node.sh \
            --target ${{ matrix.rust_target }} \
            --variant-id ${{ matrix.variant_id }} \
            --run-smoke ${{ matrix.run_smoke }}

      - name: Run the AArch64 Server Node version smoke test under QEMU
        if: ${{ matrix.architecture == 'arm64' }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          artifact="$(find target/static-server-node -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$artifact"
          tar -xzf "$artifact" -C "$artifact_dir"
          binary="$(find "$artifact_dir" -type f -name berrykeep-server-node -print -quit)"
          test -n "$binary"
          qemu-aarch64-static "$binary" --version

      - name: Save Zig toolchain cache
        if: ${{ github.event_name != 'pull_request' && matrix.architecture == 'arm64' && steps.restore-zig.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ironmesh-build-tools
          key: ${{ steps.restore-zig.outputs.cache-primary-key }}

      - name: Upload portable ${{ matrix.architecture }} Server Node
        uses: actions/upload-artifact@v4
        with:
          name: static-server-node-linux-${{ matrix.architecture }}
          path: |
            target/static-server-node/*.tar.gz
            target/static-server-node/*.tar.gz.sha256
          if-no-files-found: error

  build-server-node-debian-package:
    name: ${{ matrix.check_name }}
    needs: build-static-server-node
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: focal
            architecture: arm64
            image: ubuntu:20.04
            check_name: Focal A64
          - suite: trixie
            architecture: arm64
            image: debian:trixie
            check_name: Trixie A64
          - suite: focal
            architecture: amd64
            image: ubuntu:20.04
            check_name: Focal AMD64
          - suite: trixie
            architecture: amd64
            image: debian:trixie
            check_name: Trixie AMD64
          - suite: noble
            architecture: amd64
            image: ubuntu:24.04
            check_name: Noble AMD64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified static Server Node
        uses: actions/download-artifact@v4
        with:
          name: static-server-node-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/static-server-node

      - name: Build ${{ matrix.suite }} ${{ matrix.architecture }} package wrapper
        shell: bash
        run: |
          set -euo pipefail
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          workspace_dir="$(basename "$GITHUB_WORKSPACE")"
          docker run --rm \
            --volume "${workspace_parent}:/build" \
            --volume "${RUNNER_TEMP}:/runner-temp" \
            --workdir "/build/${workspace_dir}" \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              package_dir="/runner-temp/debian/${{ matrix.suite }}-${{ matrix.architecture }}"
              mkdir -p "$package_dir"
              case "${{ matrix.suite }}" in
                focal)
                  echo "deb http://archive.ubuntu.com/ubuntu focal-backports main universe" \
                    > /etc/apt/sources.list.d/focal-backports.list
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    build-essential ca-certificates dh-sysuser git \
                    binutils python3 tar gzip
                  apt-get install -y --no-install-recommends -t focal-backports debhelper
                  ;;
                trixie|noble)
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    build-essential ca-certificates debhelper dh-sysuser git \
                    binutils python3 tar gzip
                  ;;
              esac
              git config --global --add safe.directory "$PWD"
              static_artifact="$(find /runner-temp/static-server-node -maxdepth 1 -name "*.tar.gz" -print -quit)"
              test -n "$static_artifact"
              ./scripts/build-local-debs.sh \
                --suite "${{ matrix.suite }}" \
                --arch "${{ matrix.architecture }}" \
                --server-node-only \
                --static-server-node-artifact "$static_artifact" \
                --no-check-build-deps \
                -- -j1
              find /build -maxdepth 1 -type f \
                \( -name "berrykeep-server-node_*_${{ matrix.architecture }}.deb" \
                  -o -name "ironmesh-server-node_*_${{ matrix.architecture }}.deb" \
                  -o -name "berrykeep_*_${{ matrix.architecture }}.changes" \
                  -o -name "berrykeep_*_${{ matrix.architecture }}.buildinfo" \) \
                -exec cp -v {} "${package_dir}/" \;
            '

      - name: Upload ${{ matrix.suite }} ${{ matrix.architecture }} Debian package
        uses: actions/upload-artifact@v4
        with:
          name: server-node-debian-${{ matrix.suite }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/debian/${{ matrix.suite }}-${{ matrix.architecture }}/
          if-no-files-found: error

  publish-server-node-debian-packages:
    name: Sign and deploy Server Node Debian packages
    needs: build-server-node-debian-package
    # Publishing requires the protected apt-repository environment. This is
    # manual-only, runs from main, and never grants deployment secrets to PRs.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: apt-repository
    timeout-minutes: 30
    env:
      APT_REPO_SIGN_KEY: ${{ vars.BERRYKEEP_APT_ARCHIVE_GPG_FINGERPRINT }}
      APT_REPO_GPG_PASSPHRASE: ${{ secrets.BERRYKEEP_APT_ARCHIVE_GPG_PASSPHRASE }}
      APT_REPO_REMOTE: ${{ vars.BERRYKEEP_APT_REPOSITORY_REMOTE }}
      APT_REPO_REMOTE_DIR: ${{ vars.BERRYKEEP_APT_REPOSITORY_REMOTE_DIR }}
      APT_REPO_URL: ${{ vars.BERRYKEEP_APT_REPOSITORY_URL }}
      APT_REPO_COMPATIBILITY_REMOTE: ${{ vars.BERRYKEEP_APT_COMPATIBILITY_REPOSITORY_REMOTE }}
      APT_REPO_COMPATIBILITY_REMOTE_DIR: ${{ vars.BERRYKEEP_APT_COMPATIBILITY_REPOSITORY_REMOTE_DIR }}
      APT_REPO_COMPATIBILITY_URL: ${{ vars.BERRYKEEP_APT_COMPATIBILITY_REPOSITORY_URL }}
      BERRYKEEP_APT_ARCHIVE_GPG_PRIVATE_KEY_B64: ${{ secrets.BERRYKEEP_APT_ARCHIVE_GPG_PRIVATE_KEY_B64 }}
      BERRYKEEP_APT_REPOSITORY_SSH_PRIVATE_KEY: ${{ secrets.BERRYKEEP_APT_REPOSITORY_SSH_PRIVATE_KEY }}
      BERRYKEEP_APT_REPOSITORY_KNOWN_HOSTS: ${{ secrets.BERRYKEEP_APT_REPOSITORY_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server-node Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: server-node-debian-*
          path: ${{ runner.temp }}/server-node-packages

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils curl gnupg openssh-client rsync

      - name: Configure signing and deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${APT_REPO_SIGN_KEY:?configure BERRYKEEP_APT_ARCHIVE_GPG_FINGERPRINT}"
          : "${APT_REPO_GPG_PASSPHRASE:?configure BERRYKEEP_APT_ARCHIVE_GPG_PASSPHRASE}"
          : "${APT_REPO_REMOTE:?configure BERRYKEEP_APT_REPOSITORY_REMOTE}"
          : "${APT_REPO_REMOTE_DIR:?configure BERRYKEEP_APT_REPOSITORY_REMOTE_DIR}"
          : "${APT_REPO_URL:?configure BERRYKEEP_APT_REPOSITORY_URL}"
          : "${APT_REPO_COMPATIBILITY_REMOTE:?configure BERRYKEEP_APT_COMPATIBILITY_REPOSITORY_REMOTE}"
          : "${APT_REPO_COMPATIBILITY_REMOTE_DIR:?configure BERRYKEEP_APT_COMPATIBILITY_REPOSITORY_REMOTE_DIR}"
          : "${APT_REPO_COMPATIBILITY_URL:?configure BERRYKEEP_APT_COMPATIBILITY_REPOSITORY_URL}"
          : "${BERRYKEEP_APT_ARCHIVE_GPG_PRIVATE_KEY_B64:?configure BERRYKEEP_APT_ARCHIVE_GPG_PRIVATE_KEY_B64}"
          : "${BERRYKEEP_APT_REPOSITORY_SSH_PRIVATE_KEY:?configure BERRYKEEP_APT_REPOSITORY_SSH_PRIVATE_KEY}"
          : "${BERRYKEEP_APT_REPOSITORY_KNOWN_HOSTS:?configure BERRYKEEP_APT_REPOSITORY_KNOWN_HOSTS}"

          export GNUPGHOME="$RUNNER_TEMP/apt-archive-gnupg"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME" "$HOME/.ssh"
          printf '%s' "$BERRYKEEP_APT_ARCHIVE_GPG_PRIVATE_KEY_B64" | base64 --decode \
            | gpg --batch --import
          actual_fingerprint="$(gpg --batch --with-colons --fingerprint "$APT_REPO_SIGN_KEY" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          expected_fingerprint="${APT_REPO_SIGN_KEY//[[:space:]]/}"
          actual_fingerprint="${actual_fingerprint//[[:space:]]/}"
          test "$actual_fingerprint" = "$expected_fingerprint"

          umask 077
          printf '%s\n' "$BERRYKEEP_APT_REPOSITORY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$BERRYKEEP_APT_REPOSITORY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Build signed repository matrix
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          matrix_file="$RUNNER_TEMP/server-node-debian-matrix.txt"
          : > "$matrix_file"
          package_dirs=("$RUNNER_TEMP"/server-node-packages/server-node-debian-*)
          test "${#package_dirs[@]}" -gt 0
          for package_dir in "${package_dirs[@]}"; do
            target="${package_dir##*/server-node-debian-}"
            case "$target" in
              *-amd64) architecture=amd64 ;;
              *-arm64) architecture=arm64 ;;
              *-armhf) architecture=armhf ;;
              *)
                echo "unrecognized package artifact target: $target" >&2
                exit 1
                ;;
            esac
            suite="${target%-${architecture}}"
            test -n "$suite"
            matches=("$package_dir"/berrykeep-server-node_*_"$architecture".deb)
            test "${#matches[@]}" -eq 1
            printf '%s %s %s\n' "$suite" "$architecture" "${matches[0]}" >> "$matrix_file"
          done
          ./scripts/build-apt-repository.sh \
            --repo-dir "$RUNNER_TEMP/apt-repo" \
            --server-node-matrix "$matrix_file" \
            --import-remote "${APT_REPO_REMOTE}:${APT_REPO_REMOTE_DIR}"

      - name: Deploy signed repository matrix
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/deploy-apt-repository.sh \
            --repo-dir "$RUNNER_TEMP/apt-repo" \
            --server-node-matrix "$RUNNER_TEMP/server-node-debian-matrix.txt" \
            --remote "$APT_REPO_REMOTE" \
            --remote-dir "$APT_REPO_REMOTE_DIR" \
            --url "$APT_REPO_URL"
          ./scripts/deploy-apt-repository.sh \
            --repo-dir "$RUNNER_TEMP/apt-repo" \
            --server-node-matrix "$RUNNER_TEMP/server-node-debian-matrix.txt" \
            --remote "$APT_REPO_COMPATIBILITY_REMOTE" \
            --remote-dir "$APT_REPO_COMPATIBILITY_REMOTE_DIR" \
            --url "$APT_REPO_COMPATIBILITY_URL"
