name: Focal A64

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-focal-arm64-packages:
    name: Focal A64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Rust toolchain for packaging inputs
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-17

      - name: Install ELF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file xz-utils

      - name: Restore Zig toolchain cache
        id: restore-zig
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ironmesh-build-tools
          key: static-server-node-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Cache static Server Node Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-server-node-aarch64
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build and verify static AArch64 Server Node
        run: |
          ./scripts/build-static-server-node.sh \
            --target aarch64-unknown-linux-musl \
            --variant-id aarch64-generic \
            --run-smoke always

      - name: Save Zig toolchain cache
        if: ${{ github.event_name != 'pull_request' && steps.restore-zig.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ironmesh-build-tools
          key: ${{ steps.restore-zig.outputs.cache-primary-key }}

      - name: Prepare vendored crates and web assets
        run: ./scripts/prepare-ppa-source.sh

      - name: Restore sccache (ARM64 Focal build)
        id: restore-sccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache-arm64
          key: sccache-arm64-focal-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-arm64-focal-

      - name: Build Focal ARM64 Debian packages
        shell: bash
        env:
          # sccache caches the rustc invocations of the in-container release
          # build across runs. The GHA cache backend can't be reached from
          # inside `docker run`, so we mount an on-disk cache dir that
          # actions/cache round-trips between runs.
          SCCACHE_VERSION: v0.16.0
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sccache_dir="${RUNNER_TEMP}/sccache-arm64"
          mkdir -p "$sccache_dir"
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          workspace_dir="$(basename "$GITHUB_WORKSPACE")"
          docker run --rm \
            --volume "${workspace_parent}:/build" \
            --volume "${sccache_dir}:/sccache" \
            --workdir "/build/${workspace_dir}" \
            --env RUSTC_WRAPPER=sccache \
            --env SCCACHE_DIR=/sccache \
            --env SCCACHE_CACHE_SIZE=2G \
            --env CARGO_INCREMENTAL=0 \
            --env SCCACHE_VERSION="${SCCACHE_VERSION}" \
            ubuntu:20.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              echo "deb http://ports.ubuntu.com/ubuntu-ports focal-backports main universe" \
                > /etc/apt/sources.list.d/focal-backports.list
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates clang curl dh-sysuser git \
                libfuse3-dev pkg-config
              apt-get install -y --no-install-recommends -t focal-backports debhelper
              git config --global --add safe.directory "$PWD"
              curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain nightly-2026-02-17
              export PATH=/root/.cargo/bin:$PATH
              sccache_pkg="sccache-${SCCACHE_VERSION}-aarch64-unknown-linux-musl"
              curl --proto "=https" --tlsv1.2 -fsSL \
                "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${sccache_pkg}.tar.gz" \
                | tar -xz -C /tmp
              install -m 0755 "/tmp/${sccache_pkg}/sccache" /usr/local/bin/sccache
              CARGO_BUILD_JOBS=2 ./scripts/build-local-debs.sh \
                --prebuilt-server-node \
                  "$PWD/target/aarch64-unknown-linux-musl/release/ironmesh-server-node" \
                --no-prepare --no-check-build-deps -- -j2
              sccache --show-stats || true
              find /build -maxdepth 1 -type f \
                \( -name "ironmesh-*_*_arm64.deb" \
                  -o -name "ironmesh_*_arm64.changes" \
                  -o -name "ironmesh_*_arm64.buildinfo" \) \
                -exec cp -v {} artifacts/ \;
            '
          # The explicit save step runs as the runner user, but the container
          # wrote the cache as root; hand ownership back before that step.
          sudo chown -R "$(id -u):$(id -g)" "$sccache_dir" || true

      - name: Save sccache (ARM64 Focal build)
        if: ${{ github.event_name != 'pull_request' && steps.restore-sccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache-arm64
          key: ${{ steps.restore-sccache.outputs.cache-primary-key }}

      - name: Upload Focal ARM64 Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: focal-arm64-debian-packages
          if-no-files-found: error
          path: artifacts/

      - name: Upload portable AArch64 Server Node
        uses: actions/upload-artifact@v4
        with:
          name: static-server-node-linux-arm64
          path: |
            target/static-server-node/*.tar.gz
            target/static-server-node/*.tar.gz.sha256
          if-no-files-found: error
