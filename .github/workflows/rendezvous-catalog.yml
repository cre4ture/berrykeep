name: Rendezvous catalog

on:
  pull_request:
    paths:
      - "discovery/**"
      - "scripts/validate_global_rendezvous_catalog.py"
      - "scripts/test_validate_global_rendezvous_catalog.py"
      - "docs/default-global-rendezvous-discovery.md"
      - ".github/workflows/rendezvous-catalog.yml"
  push:
    branches: [main]
    paths:
      - "discovery/**"
      - "scripts/validate_global_rendezvous_catalog.py"
      - "scripts/test_validate_global_rendezvous_catalog.py"
      - "docs/default-global-rendezvous-discovery.md"
      - ".github/workflows/rendezvous-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Test catalog validation
        run: python -m unittest discover -s scripts -p test_validate_global_rendezvous_catalog.py -v
      - name: Validate published catalog
        run: python scripts/validate_global_rendezvous_catalog.py
