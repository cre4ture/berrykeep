name: Setup Linux FUSE runtime
description: Install and validate the FUSE runtime used by Linux system tests.

runs:
  using: composite
  steps:
    - name: Install and validate Linux FUSE runtime
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes fuse3
        fusermount3_path="$(dpkg-query --listfiles fuse3 | awk '/\/fusermount3$/ { print; exit }')"
        test -n "$fusermount3_path"
        export PATH="$(dirname "$fusermount3_path"):$PATH"
        echo "PATH=$PATH" >> "$GITHUB_ENV"
        test "$(readlink -f "$(command -v fusermount3)")" = "$(readlink -f "$fusermount3_path")"
        test -c /dev/fuse
        test -r /dev/fuse
        test -w /dev/fuse
        ls -l /dev/fuse "$fusermount3_path"
