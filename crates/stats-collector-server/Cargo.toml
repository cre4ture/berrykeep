[package]
name = "stats-collector-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Opts into `country::BundledCountryResolver`, a real (offline, no-API-key) IP-to-country lookup
# backed by the `iptocc` crate (doc Section 4.2). Off by default so the crate does not grow a
# mandatory extra dependency; see `country.rs` for the license/data-source rationale.
bundled-country-db = ["dep:iptocc"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server = { version = "0.8", features = ["tls-rustls"] }
iptocc = { version = "1", optional = true }
# No dependency already in this crate provides a CSPRNG (see `registration.rs`); `rand` is a
# minimal, well-established addition, pinned to the same "0.8" version `server-node-sdk` already
# uses for its own salt generation.
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Pure-Rust, embedded SQLite-compatible engine (no C toolchain / bundled libsqlite3 needed to
# build this crate). Same version already used by `server-node-sdk`'s optional Turso metadata
# backend (see `crates/server-node-sdk/src/storage/turso_impl.rs`).
turso = "0.6.0-pre.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
