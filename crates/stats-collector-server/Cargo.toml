[package]
name = "stats-collector-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Opts into `country::BundledCountryResolver`, a real (offline, no-API-key) IP-to-country lookup
# backed by the `iptocc` crate (doc Section 4.2). Off by default so the crate does not grow a
# mandatory extra dependency; see `country.rs` for the license/data-source rationale.
bundled-country-db = ["dep:iptocc"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
iptocc = { version = "1", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
