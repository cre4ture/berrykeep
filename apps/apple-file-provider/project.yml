name: BerryKeepAppleFileProvider

options:
  bundleIdPrefix: dev.berrykeep

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: 6.1

packages:
  AppleFileProviderPackage:
    path: .

targets:
  BerryKeepMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/BerryKeepMacApp
      - path: Sources/AppleAppSupport
      - path: Sources/AppleNativeBridge
      - path: Sources/AppleFileProviderRuntime
    dependencies:
      - package: AppleFileProviderPackage
        product: AppleCore
      - package: AppleFileProviderPackage
        product: AppleFileProviderShared
      - sdk: FileProvider.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Rust Apple FFI
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/build-rust-apple-ffi.sh" "$PLATFORM_NAME" "$CONFIGURATION"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/BerryKeepSharedAccess.entitlements
        INFOPLIST_FILE: Resources/Info/BerryKeepMacApp-Info.plist
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../ios-app/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustArtifacts/$(PLATFORM_NAME)
        MACOSX_DEPLOYMENT_TARGET: 14.0
        OTHER_LDFLAGS: $(inherited) -lios_app
        PRODUCT_BUNDLE_IDENTIFIER: dev.berrykeep.apple.macapp
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AppleNativeBridge/BerryKeepAppleFFI-Bridging-Header.h

  BerryKeepMacFileProviderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/BerryKeepMacFileProviderExtension
      - path: Sources/AppleNativeBridge
      - path: Sources/AppleFileProviderRuntime
    dependencies:
      - package: AppleFileProviderPackage
        product: AppleCore
      - package: AppleFileProviderPackage
        product: AppleFileProviderShared
      - sdk: AVFoundation.framework
      - sdk: FileProvider.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Rust Apple FFI
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/build-rust-apple-ffi.sh" "$PLATFORM_NAME" "$CONFIGURATION"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/BerryKeepSharedAccess.entitlements
        INFOPLIST_FILE: Resources/Info/BerryKeepMacFileProviderExtension-Info.plist
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../ios-app/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustArtifacts/$(PLATFORM_NAME)
        MACOSX_DEPLOYMENT_TARGET: 14.0
        OTHER_LDFLAGS: $(inherited) -lios_app
        PRODUCT_BUNDLE_IDENTIFIER: dev.berrykeep.apple.macfileprovider
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AppleNativeBridge/BerryKeepAppleFFI-Bridging-Header.h

  BerryKeepIosApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/BerryKeepIosApp
      - path: Sources/AppleAppSupport
      - path: Sources/AppleNativeBridge
      - path: Sources/AppleFileProviderRuntime
      - path: Resources/Assets.xcassets
    dependencies:
      - target: BerryKeepIosFileProviderExtension
        embed: true
      - package: AppleFileProviderPackage
        product: AppleCore
      - package: AppleFileProviderPackage
        product: AppleFileProviderShared
      - sdk: FileProvider.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Rust Apple FFI
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/build-rust-apple-ffi.sh" "$PLATFORM_NAME" "$CONFIGURATION"
    settings:
      base:
        INFOPLIST_FILE: Resources/Info/BerryKeepIosApp-Info.plist
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../ios-app/include
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustArtifacts/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -lios_app -framework Network -framework SystemConfiguration
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/BerryKeepSharedAccess.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.berrykeep.apple.iosapp
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AppleNativeBridge/BerryKeepAppleFFI-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: YES
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: YES
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"

  BerryKeepIosFileProviderExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/BerryKeepIosFileProviderExtension
      - path: Sources/AppleNativeBridge
      - path: Sources/AppleFileProviderRuntime
    dependencies:
      - package: AppleFileProviderPackage
        product: AppleCore
      - package: AppleFileProviderPackage
        product: AppleFileProviderShared
      - sdk: FileProvider.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Rust Apple FFI
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/build-rust-apple-ffi.sh" "$PLATFORM_NAME" "$CONFIGURATION"
    settings:
      base:
        INFOPLIST_FILE: Resources/Info/BerryKeepIosFileProviderExtension-Info.plist
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../ios-app/include
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustArtifacts/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -lios_app -framework Network -framework SystemConfiguration
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/BerryKeepSharedAccess.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.berrykeep.apple.iosapp.fileprovider
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AppleNativeBridge/BerryKeepAppleFFI-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: YES
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: YES
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"

  BerryKeepAppleProjectTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BerryKeepAppleProjectTests
    dependencies:
      - target: BerryKeepMacApp
      - package: AppleFileProviderPackage
        product: AppleCore
      - package: AppleFileProviderPackage
        product: AppleFileProviderShared
    settings:
      base:
        INFOPLIST_FILE: Resources/Info/BerryKeepAppleProjectTests-Info.plist
        MACOSX_DEPLOYMENT_TARGET: 14.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.berrykeep.apple.tests
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

  BerryKeepIosProjectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BerryKeepIosProjectTests
    dependencies:
      - package: AppleFileProviderPackage
        product: AppleCore
      - package: AppleFileProviderPackage
        product: AppleFileProviderShared
    settings:
      base:
        INFOPLIST_FILE: Resources/Info/BerryKeepIosProjectTests-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.berrykeep.apple.ios.tests
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        BUNDLE_LOADER: ""
        TEST_HOST: ""

  BerryKeepIosUiTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/BerryKeepIosUiTests
    dependencies:
      - target: BerryKeepIosApp
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.berrykeep.apple.ios.uitests
        TARGETED_DEVICE_FAMILY: 1,2

schemes:
  BerryKeepIosApp:
    build:
      targets:
        BerryKeepIosApp: all
        BerryKeepIosFileProviderExtension: all
    run:
      config: Debug
      executable: BerryKeepIosApp
    test:
      gatherCoverageData: false
      targets:
        - BerryKeepIosProjectTests
        - BerryKeepIosUiTests
  BerryKeepMacApp:
    build:
      targets:
        BerryKeepMacApp: all
        BerryKeepMacFileProviderExtension: all
    run:
      config: Debug
      executable: BerryKeepMacApp
    test:
      gatherCoverageData: false
      targets:
        - BerryKeepAppleProjectTests
  BerryKeepAppleProject:
    build:
      targets:
        BerryKeepMacApp: all
        BerryKeepMacFileProviderExtension: all
        BerryKeepIosApp: all
        BerryKeepIosFileProviderExtension: all
  BerryKeepMacProject:
    build:
      targets:
        BerryKeepMacApp: all
        BerryKeepMacFileProviderExtension: all
    test:
      gatherCoverageData: false
      targets:
        - BerryKeepAppleProjectTests
  BerryKeepIosProject:
    build:
      targets:
        BerryKeepIosProjectTests: all
    test:
      gatherCoverageData: false
      targets:
        - BerryKeepIosProjectTests
