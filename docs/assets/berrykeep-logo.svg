<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">BerryKeep logo</title>
  <desc id="desc">The BerryKeep logo with a connected grape cluster, wordmark, and connected status line.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="leaf" x1="100" y1="6.24" x2="152.8" y2="37.92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="status-line" x1="6" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <g transform="translate(38 30)">
    <rect width="200" height="200" rx="44" fill="url(#panel)"/>
    <path d="M100 22.08 Q126.4 6.24 152.8 16.8 Q140.92 37.92 113.2 37.92 Z" fill="url(#leaf)"/>
    <line x1="100" y1="35.28" x2="100" y2="53.76" stroke="#22c55e" stroke-width="6.6" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-width="6.6" opacity="0.85" stroke-linecap="round">
      <line x1="100" y1="69.6" x2="57.76" y2="109.2"/>
      <line x1="100" y1="69.6" x2="142.24" y2="109.2"/>
      <line x1="57.76" y1="109.2" x2="142.24" y2="109.2"/>
      <line x1="57.76" y1="109.2" x2="100" y2="162"/>
      <line x1="142.24" y1="109.2" x2="100" y2="162"/>
    </g>
    <circle cx="100" cy="69.6" r="18.48" fill="#ffffff"/>
    <circle cx="57.76" cy="109.2" r="18.48" fill="#ffffff"/>
    <circle cx="142.24" cy="109.2" r="18.48" fill="#ffffff"/>
    <circle cx="100" cy="162" r="18.48" fill="#ffffff"/>
    <circle cx="93.4" cy="63" r="5.016" fill="#e9d5ff" opacity="0.75"/>
    <circle cx="51.16" cy="102.6" r="5.016" fill="#e9d5ff" opacity="0.75"/>
  </g>

  <g transform="translate(286 0)">
    <text x="0" y="122" fill="#4c1d95" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="94" font-weight="700" letter-spacing="-3">
      BerryKeep
    </text>
    <text x="4" y="166" fill="#a21caf" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3.4">
      DISTRIBUTED EDGE STORAGE
    </text>
    <path d="M6 190 H520" stroke="url(#status-line)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="6" cy="190" r="6" fill="#22c55e"/>
    <circle cx="180" cy="190" r="6" fill="#a855f7"/>
    <circle cx="348" cy="190" r="6" fill="#d946ef"/>
    <circle cx="520" cy="190" r="6" fill="#22c55e"/>
  </g>
</svg>
