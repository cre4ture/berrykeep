<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">BerryKeep tray icon</title>
  <desc id="desc">A high-contrast connected berry cluster optimized for small icon sizes.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#panel)"/>
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <line x1="100" y1="69.6" x2="57.76" y2="109.2"/>
    <line x1="100" y1="69.6" x2="142.24" y2="109.2"/>
    <line x1="57.76" y1="109.2" x2="142.24" y2="109.2"/>
    <line x1="57.76" y1="109.2" x2="100" y2="162"/>
    <line x1="142.24" y1="109.2" x2="100" y2="162"/>
  </g>
  <circle cx="100" cy="69.6" r="20" fill="#ffffff"/>
  <circle cx="57.76" cy="109.2" r="20" fill="#ffffff"/>
  <circle cx="142.24" cy="109.2" r="20" fill="#ffffff"/>
  <circle cx="100" cy="162" r="20" fill="#ffffff"/>
</svg>
