<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      try {
        const storageKey = "ironmesh-color-scheme";
        const accentStorageKey = "ironmesh-accent-color";
        const accentQueryParameter = "accent_color";
        const embeddedClientQueryParameter = "embedded_client";
        const storedColorScheme = window.localStorage.getItem(storageKey);
        const storedAccent = window.localStorage.getItem(accentStorageKey);
        const queryParameters = new URLSearchParams(window.location.search);
        const embeddedClient = queryParameters.get(embeddedClientQueryParameter);
        const hostAccent =
          embeddedClient === "android" || embeddedClient === "ios"
            ? queryParameters.get(accentQueryParameter)
            : null;
        const colorScheme =
          storedColorScheme === "light" || storedColorScheme === "dark" || storedColorScheme === "auto"
            ? storedColorScheme
            : "auto";
        const computedColorScheme =
          colorScheme === "auto"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : colorScheme;
        document.documentElement.setAttribute("data-mantine-color-scheme", computedColorScheme);

        const normalizeAccent = (value) =>
          /^#?([\da-f]{6})$/i.test(value ?? "")
            ? `#${value.replace(/^#/, "").toLowerCase()}`
            : /^#?([\da-f]{3})$/i.test(value ?? "")
              ? `#${value
                .replace(/^#/, "")
                .split("")
                .map((channel) => `${channel}${channel}`)
                .join("")
                .toLowerCase()}`
              : null;
        const normalizedAccent = normalizeAccent(hostAccent) ?? normalizeAccent(storedAccent) ?? "#14b8a6";
        const red = Number.parseInt(normalizedAccent.slice(1, 3), 16);
        const green = Number.parseInt(normalizedAccent.slice(3, 5), 16);
        const blue = Number.parseInt(normalizedAccent.slice(5, 7), 16);
        const mixChannel = (value, target, amount) => Math.round(value + (target - value) * amount);
        const toRgb = (r, g, b) => `${r}, ${g}, ${b}`;
        document.documentElement.style.setProperty("--ironmesh-accent-rgb", toRgb(red, green, blue));
        document.documentElement.style.setProperty(
          "--ironmesh-accent-soft-rgb",
          toRgb(mixChannel(red, 255, 0.52), mixChannel(green, 255, 0.52), mixChannel(blue, 255, 0.52))
        );
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/ironmesh-favicon.svg" />
    <title>BerryKeep Client UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
